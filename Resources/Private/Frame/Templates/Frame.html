<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<a class="typo3-styleguide-frame__skip" href="#main"><f:translate key="LLL:EXT:typo3_styleguide/Resources/Private/Language/locallang.xlf:frame.skip"/></a>

<div class="typo3-styleguide-frame">
    <f:render partial="StyleguideFrame/Header" arguments="{brand: styleguideBrand, logo: styleguideLogo, logoDark: styleguideLogoDark, home: styleguideHome, sections: styleguideSections}" />

    <f:render partial="StyleguideFrame/Intro" arguments="{styleguideBreadcrumb: styleguideBreadcrumb}" />

    <div class="typo3-styleguide-frame__inner typo3-styleguide-frame__layout">
        <f:if condition="{styleguidePages}">
            <aside class="typo3-styleguide-frame__aside">
                <f:render partial="StyleguideFrame/SideNav" arguments="{items: styleguideTree, headingLevel: styleguideHeadingLevel}" />
            </aside>
        </f:if>
        <main id="main" class="typo3-styleguide-frame__main">
            <f:render partial="StyleguideFrame/HeaderImage" arguments="{image: styleguideHeaderImage.0}" />
            <f:format.raw>{content}</f:format.raw>
            <f:render partial="StyleguideFrame/Updated" />
        </main>
    </div>
</div>

</html>
