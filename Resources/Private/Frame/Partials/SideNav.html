<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<nav class="typo3-styleguide-frame__sidenav" aria-label="{f:translate(key: 'LLL:EXT:typo3_styleguide/Resources/Private/Language/locallang.xlf:frame.nav.section')}">
    <ul class="typo3-styleguide-frame__sidenav-list">
        <f:for each="{items}" as="item">
            <li>
                <a class="typo3-styleguide-frame__sidenav-link{f:if(condition: item.current, then: ' typo3-styleguide-frame__sidenav-link--active')}" href="{item.link}" aria-current="{f:if(condition: item.current, then: 'page', else: 'false')}">{item.title}</a>
            </li>
        </f:for>
    </ul>
</nav>

</html>
