<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:variable name="lll" value="LLL:EXT:typo3_styleguide/Resources/Private/Language/locallang.xlf:" />

<f:asset.script identifier="typo3styleguide_frame_sidenav_js" src="EXT:typo3_styleguide/Resources/Public/JavaScript/frame_sidenav.js" />

<details class="typo3-styleguide-frame__sidenav-toggle" open data-sg-sidenav-toggle>
    <summary><f:translate key="{lll}frame.nav.section"/></summary>
    <nav class="typo3-styleguide-frame__sidenav" aria-label="{f:translate(key: '{lll}frame.nav.section')}">
        <div class="typo3-styleguide-frame__sidenav-filter" data-sg-sidenav-filter data-none="{f:translate(key: '{lll}frame.nav.filter.none')}" hidden>
            <label for="typo3-styleguide-sidenav-filter"><f:translate key="{lll}frame.nav.filter"/></label>
            <input type="search" id="typo3-styleguide-sidenav-filter" autocomplete="off" data-sg-sidenav-filter-input>
            <p class="typo3-styleguide-frame__sidenav-status" role="status" data-sg-sidenav-filter-status></p>
        </div>
        <ul class="typo3-styleguide-frame__sidenav-list">
            <f:for each="{items}" as="item">
                <li data-sg-sidenav-entry>
                    <f:if condition="{item.children}">
                        <f:then>
                            <details class="typo3-styleguide-frame__sidenav-group"{f:if(condition: item.active, then: ' open')} data-sg-sidenav-group>
                                <summary class="typo3-styleguide-frame__sidenav-group-head">
                                    <span>{item.title}</span>
                                    <span class="typo3-styleguide-frame__sidenav-count">{item.children -> f:count()}</span>
                                </summary>
                                <ul class="typo3-styleguide-frame__sidenav-list">
                                    <li data-sg-sidenav-entry data-sg-sidenav-overview>
                                        <a class="typo3-styleguide-frame__sidenav-link{f:if(condition: item.current, then: ' typo3-styleguide-frame__sidenav-link--active')}" href="{item.link}" aria-current="{f:if(condition: item.current, then: 'page', else: 'false')}"><f:translate key="{lll}frame.nav.overview"/></a>
                                    </li>
                                    <f:for each="{item.children}" as="child">
                                        <li data-sg-sidenav-entry>
                                            <a class="typo3-styleguide-frame__sidenav-link{f:if(condition: child.current, then: ' typo3-styleguide-frame__sidenav-link--active')}" href="{child.link}" aria-current="{f:if(condition: child.current, then: 'page', else: 'false')}">{child.title}</a>
                                        </li>
                                    </f:for>
                                </ul>
                            </details>
                        </f:then>
                        <f:else>
                            <a class="typo3-styleguide-frame__sidenav-link{f:if(condition: item.current, then: ' typo3-styleguide-frame__sidenav-link--active')}" href="{item.link}" aria-current="{f:if(condition: item.current, then: 'page', else: 'false')}">{item.title}</a>
                        </f:else>
                    </f:if>
                </li>
            </f:for>
        </ul>
    </nav>
</details>

</html>
