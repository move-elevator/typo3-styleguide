<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:variable name="lll" value="LLL:EXT:typo3_styleguide/Resources/Private/Language/locallang.xlf:" />
<f:comment>Read when the partial renders, below the content, because rendering the content raises the value to its newest record</f:comment>
<f:variable name="changed"><f:cObject typoscriptObjectPath="lib.typo3styleguideUpdated" /></f:variable>
<f:if condition="{changed}">
    <p class="typo3-styleguide-frame__updated">
        <f:translate key="{lll}frame.updated"/>
        <time datetime="{f:format.date(date: '@{changed}', format: 'Y-m-d')}"><f:format.date date="@{changed}" format="{f:translate(key: '{lll}frame.updated.format')}"/></time>
    </p>
</f:if>

</html>
