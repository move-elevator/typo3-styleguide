<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:asset.script identifier="typo3styleguide_frame_theme_js" src="EXT:typo3_styleguide/Resources/Public/JavaScript/frame_theme.js" priority="true" />

<header class="typo3-styleguide-frame__header">
    <div class="typo3-styleguide-frame__inner typo3-styleguide-frame__header-inner">
        <f:for each="{home}" as="item">
            <a class="typo3-styleguide-frame__brand" href="{item.link}">
                <f:if condition="{logo}">
                    <f:then>
                        <img class="typo3-styleguide-frame__logo typo3-styleguide-frame__logo--light" src="{f:uri.resource(path: logo)}" alt="{brand}">
                        <f:if condition="{logoDark}"><img class="typo3-styleguide-frame__logo typo3-styleguide-frame__logo--dark" src="{f:uri.resource(path: logoDark)}" alt="{brand}"></f:if>
                    </f:then>
                    <f:else>{brand}</f:else>
                </f:if>
            </a>
        </f:for>
        <nav class="typo3-styleguide-frame__nav" aria-label="{f:translate(key: 'LLL:EXT:typo3_styleguide/Resources/Private/Language/locallang.xlf:frame.nav.main')}">
            <ul class="typo3-styleguide-frame__nav-list">
                <f:for each="{home}" as="item">
                    <li>
                        <a class="typo3-styleguide-frame__nav-link{f:if(condition: item.current, then: ' typo3-styleguide-frame__nav-link--active')}" href="{item.link}" aria-current="{f:if(condition: item.current, then: 'page', else: 'false')}"><f:translate key="LLL:EXT:typo3_styleguide/Resources/Private/Language/locallang.xlf:frame.nav.home"/></a>
                    </li>
                </f:for>
                <f:for each="{sections}" as="item">
                    <li>
                        <a class="typo3-styleguide-frame__nav-link{f:if(condition: '{item.active} || {item.current}', then: ' typo3-styleguide-frame__nav-link--active')}" href="{item.link}" aria-current="{f:if(condition: item.current, then: 'page', else: 'false')}">{item.title}</a>
                    </li>
                </f:for>
            </ul>
        </nav>
        <button type="button" class="typo3-styleguide-frame__theme" data-sg-theme-toggle aria-pressed="false" aria-label="{f:translate(key: 'LLL:EXT:typo3_styleguide/Resources/Private/Language/locallang.xlf:frame.theme')}" hidden>
            <svg class="typo3-styleguide-frame__theme-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
            <svg class="typo3-styleguide-frame__theme-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        </button>
    </div>
</header>

</html>
