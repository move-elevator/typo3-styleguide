<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:variable name="isStart" value="{f:if(condition: '{styleguideBreadcrumb -> f:count()} == 1', then: 1, else: 0)}" />
<div class="typo3-styleguide-frame__intro{f:if(condition: isStart, then: ' typo3-styleguide-frame__intro--start')}">
    <div class="typo3-styleguide-frame__inner">
        <f:if condition="{isStart}">
            <f:else>
                <f:render partial="StyleguideFrame/Breadcrumb" arguments="{items: styleguideBreadcrumb}" />
            </f:else>
        </f:if>
        <div class="typo3-styleguide-frame__accent" aria-hidden="true"></div>
        <h1 class="typo3-styleguide-frame__title"><f:for each="{styleguideBreadcrumb}" as="crumb" iteration="crumbIteration"><f:if condition="{crumbIteration.isLast}">{crumb.title}</f:if></f:for></h1>
        <f:if condition="{isStart}">
            <f:for each="{styleguideBreadcrumb}" as="crumb">
                <f:if condition="{crumb.data.subtitle}"><p class="typo3-styleguide-frame__lead">{crumb.data.subtitle}</p></f:if>
            </f:for>
            <f:render partial="StyleguideFrame/Search" />
        </f:if>
    </div>
</div>

</html>
