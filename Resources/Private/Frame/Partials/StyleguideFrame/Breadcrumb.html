<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<nav class="typo3-styleguide-frame__breadcrumb" aria-label="{f:translate(key: 'LLL:EXT:typo3_styleguide/Resources/Private/Language/locallang.xlf:frame.breadcrumb')}">
    <ol class="typo3-styleguide-frame__breadcrumb-list">
        <f:for each="{items}" as="item" iteration="iterator">
            <li>
                <f:if condition="{iterator.isLast}">
                    <f:then><span aria-current="page">{item.title}</span></f:then>
                    <f:else><a href="{item.link}">{item.title}</a></f:else>
                </f:if>
            </li>
        </f:for>
    </ol>
</nav>

</html>
