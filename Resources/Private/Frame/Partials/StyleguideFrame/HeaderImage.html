<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:if condition="{image}">
    <figure class="typo3-styleguide-frame__header-image">
        <picture>
            <f:comment>Image processing keeps only the first frame of a GIF, so the animation is the original file and the still a PNG, also for a GIF too small to be scaled</f:comment>
            <f:if condition="{image.mimeType} == 'image/gif'">
                <f:then>
                    <source media="(prefers-reduced-motion: no-preference)" srcset="{image.publicUrl}">
                    <f:image image="{image}" maxWidth="1600" fileExtension="png" alt="{image.alternative}"/>
                </f:then>
                <f:else><f:image image="{image}" maxWidth="1600" alt="{image.alternative}"/></f:else>
            </f:if>
        </picture>
    </figure>
</f:if>

</html>
