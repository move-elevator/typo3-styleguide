<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<p><strong>Layout:</strong> {layout}</p>
<f:if condition="{pageTitles}">
    <ul>
        <f:for each="{pageTitles}" as="pageTitle">
            <li>{pageTitle}</li>
        </f:for>
    </ul>
</f:if>
</html>
