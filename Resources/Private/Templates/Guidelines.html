<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Default" />
<f:section name="Main">

<f:asset.css identifier="typo3styleguide_element_css" href="EXT:typo3_styleguide/Resources/Public/Css/Patterns.css"/>

<div class="typo3-styleguide__frame">
    <f:if condition="{guidelines}">
        <ul class="typo3-styleguide__guidelines" role="list">
            <f:for each="{guidelines}" as="guideline">
                <f:if condition="{guideline.data.text}">
                    <li class="typo3-styleguide__guideline typo3-styleguide__guideline--{f:if(condition: '{guideline.data.type} == dont', then: 'dont', else: 'do')}">
                        <p class="typo3-styleguide__guideline-label">
                            <f:if condition="{guideline.data.type} == dont">
                                <f:then>
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                                    <f:translate key="LLL:EXT:typo3_styleguide/Resources/Private/Language/locallang.xlf:tx_typo3styleguide_guideline.type.dont"/>
                                </f:then>
                                <f:else>
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                                    <f:translate key="LLL:EXT:typo3_styleguide/Resources/Private/Language/locallang.xlf:tx_typo3styleguide_guideline.type.do"/>
                                </f:else>
                            </f:if>
                        </p>
                        <f:if condition="{guideline.data.path}">
                            <img class="typo3-styleguide__guideline-image" src="{f:uri.resource(path: guideline.data.path)}" alt="" loading="lazy"/>
                        </f:if>
                        <p class="typo3-styleguide__guideline-text">{guideline.data.text}</p>
                    </li>
                </f:if>
            </f:for>
        </ul>
    </f:if>
</div>

</f:section>
</html>
