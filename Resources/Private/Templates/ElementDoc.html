<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Default" />
<f:section name="Main">

<f:asset.css identifier="typo3styleguide_element_css" href="EXT:typo3_styleguide/Resources/Public/Css/Patterns.css"/>

<f:variable name="lll" value="LLL:EXT:typo3_styleguide/Resources/Private/Language/locallang.xlf:" />

<div class="typo3-styleguide__frame">
    <div class="typo3-styleguide__element-doc">
        <p class="typo3-styleguide__element-doc-type">
            <f:translate key="{lll}contentelement.elementdoc.type"/>: <strong>{elementLabel}</strong> <code>{elementCType}</code>
        </p>

        <f:if condition="{data.bodytext}">
            <div class="typo3-styleguide__element-doc-note">
                <f:format.html>{data.bodytext}</f:format.html>
            </div>
        </f:if>

        <f:if condition="{examples}">
            <f:render partial="Preview/Examples" arguments="{examples: examples, uid: data.uid, label: elementLabel}" />
        </f:if>

        <f:if condition="{fields}">
            <section class="typo3-styleguide__element-doc-fields">
                <h3 class="typo3-styleguide__element-doc-title" id="typo3-styleguide-doc-{data.uid}-fields" data-sg-anchor="{elementLabel}"><f:translate key="{lll}contentelement.elementdoc.fields"/></h3>
                <ul class="typo3-styleguide__field-list" role="list">
                    <f:for each="{fields}" as="field">
                        <li>
                            <f:variable name="badge"><span class="typo3-styleguide__field-badge{f:if(condition: field.required, then: ' typo3-styleguide__field-badge--required')}"><f:translate key="{lll}contentelement.elementdoc.field.{f:if(condition: field.required, then: 'required', else: 'optional')}"/></span></f:variable>
                            <f:if condition="{field.note}">
                                <f:then>
                                    <details class="typo3-styleguide__field">
                                        <summary class="typo3-styleguide__field-head"><span class="typo3-styleguide__field-name">{field.name}</span>{badge -> f:format.raw()}</summary>
                                        <p class="typo3-styleguide__field-note">{field.note}</p>
                                    </details>
                                </f:then>
                                <f:else>
                                    <div class="typo3-styleguide__field typo3-styleguide__field-head typo3-styleguide__field-head--plain"><span class="typo3-styleguide__field-name">{field.name}</span>{badge -> f:format.raw()}</div>
                                </f:else>
                            </f:if>
                        </li>
                    </f:for>
                </ul>
            </section>
        </f:if>
    </div>
</div>

</f:section>
</html>
