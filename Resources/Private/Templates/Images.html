<html
    xmlns:sg="http://typo3.org/ns/MoveElevator/Styleguide/ViewHelpers"
    xmlns:f="http://www.w3.org/1999/XSL/Transform"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Default" />
<f:section name="Main">

<f:asset.css identifier="typo3styleguide_element_css"
             href="EXT:typo3_styleguide/Resources/Public/Css/Patterns.css"/>


<div class="typo3-styleguide__frame">
    <div class="typo3-styleguide__element-container">
        <f:for each="{images}" as="image">
            <f:if condition="{image.data.path}">
                <div class="typo3-styleguide__element">
                    <div class="typo3-styleguide__image">
                        <div class="typo3-styleguide__image-box">
                            <img src="{f:uri.resource(path: image.data.path)}" alt="{image.data.caption}"/>
                        </div>
                    </div>
                    <f:if condition="{image.data.caption}">
                        <div class="typo3-styleguide__element-caption">
                            <p class="typo3-styleguide__image-caption-text">
                                {image.data.caption}
                            </p>
                        </div>
                    </f:if>
                    <f:if condition="{data.tx_typo3styleguide_images_downloads}">
                        <f:variable name="label"><f:translate key="LLL:EXT:typo3_styleguide/Resources/Private/Language/locallang.xlf:contentelement.images.download"/></f:variable>
                        <a class="typo3-styleguide__gallery-download" href="{f:uri.resource(path: image.data.path)}" download aria-label="{label} {f:if(condition: image.data.caption, then: image.data.caption, else: '{image.data.path -> sg:format.filename()}')}">{label}</a>
                    </f:if>
                </div>
            </f:if>
        </f:for>
    </div>
</div>

</f:section>
