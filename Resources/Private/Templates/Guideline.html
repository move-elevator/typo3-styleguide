<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Default" />
<f:section name="Main">

<f:asset.css identifier="typo3styleguide_element_css" href="EXT:typo3_styleguide/Resources/Public/Css/Patterns.css"/>

<f:switch expression="{data.tx_typo3styleguide_guideline_type}">
    <f:case value="dont"><f:variable name="type" value="dont"/></f:case>
    <f:case value="note"><f:variable name="type" value="note"/></f:case>
    <f:defaultCase><f:variable name="type" value="do"/></f:defaultCase>
</f:switch>

<div class="typo3-styleguide__frame">
    <div class="typo3-styleguide__element-container">
        <article class="typo3-styleguide__rule typo3-styleguide__rule--{type}" aria-labelledby="typo3-styleguide-guideline-{data.uid}-type typo3-styleguide-guideline-{data.uid}-title">
            <p class="typo3-styleguide__rule-type" id="typo3-styleguide-guideline-{data.uid}-type">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <f:switch expression="{type}">
                        <f:case value="dont"><path d="M6 6l12 12M18 6L6 18"/></f:case>
                        <f:case value="note"><path d="M12 11v5M12 8h.01"/><circle cx="12" cy="12" r="9"/></f:case>
                        <f:defaultCase><path d="M5 12.5l4.5 4.5L19 7.5"/></f:defaultCase>
                    </f:switch>
                </svg>
                <f:translate key="contentelement.guideline.type.{type}" extensionName="Typo3Styleguide"/>
            </p>
            <f:if condition="{data.header}">
                <p class="typo3-styleguide__rule-title" id="typo3-styleguide-guideline-{data.uid}-title">{data.header}</p>
            </f:if>
            <f:if condition="{images.0}">
                <figure class="typo3-styleguide__rule-media">
                    <f:image image="{images.0}" maxWidth="800"/>
                </figure>
            </f:if>
            <f:if condition="{data.bodytext}">
                <div class="typo3-styleguide__rule-text">
                    <f:format.html>{data.bodytext}</f:format.html>
                </div>
            </f:if>
        </article>
    </div>
</div>

</f:section>
</html>
